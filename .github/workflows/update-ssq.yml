name: Update SSQ Data

on:
  schedule:
    # 北京时间 = UTC+8。双色球开奖日（周二/四/日）21:30 后结果陆续公布，
    # 这里在每天 22:00、23:00（北京时间）各跑一次，覆盖开奖日并自动同步最新一期。
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {} # 允许在 GitHub 网页手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest SSQ data
        run: python3 scripts/fetch_ssq.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: auto update ssq data"
            git push
          fi
